[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spychat"
version = "1.0.0"
description = "Hide secret messages inside images, spy-style (LSB steganography CLI)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SpyChat contributors" }]
keywords = ["steganography", "cli", "image", "encryption", "chat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Environment :: Console",
]
dependencies = [
    "Pillow>=9.0",
    "Flask>=2.2",
    "cryptography>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
prod = ["gunicorn>=21.0"]

[project.scripts]
spychat = "spychat.cli:main"
spychat-web = "spychat.server:main"

[project.urls]
Homepage = "https://github.com/kp103/spychat"
Repository = "https://github.com/kp103/spychat"

[tool.setuptools.packages.find]
include = ["spychat*"]

[tool.setuptools.package-data]
spychat = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
